```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White OLA Scooter - Rainy Night</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #07111c;
    font-family: Arial, sans-serif;
}

/* MAIN SCENE */
.scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(to bottom,
        #07111c 0%,
        #102b3d 45%,
        #1c3945 70%,
        #101820 100%);
}

/* MOON */
.moon {
    position: absolute;
    top: 70px;
    right: 130px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #e9f4f5;
    box-shadow: 0 0 45px rgba(220,245,255,.5);
}

/* CITY BUILDINGS */
.city {
    position: absolute;
    bottom: 210px;
    width: 100%;
    height: 280px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    opacity: .8;
}

.building {
    background: #09151e;
    width: 90px;
    position: relative;
}

.building:nth-child(1) { height: 180px; }
.building:nth-child(2) { height: 240px; }
.building:nth-child(3) { height: 150px; }
.building:nth-child(4) { height: 220px; }
.building:nth-child(5) { height: 190px; }
.building:nth-child(6) { height: 270px; }
.building:nth-child(7) { height: 170px; }
.building:nth-child(8) { height: 230px; }
.building:nth-child(9) { height: 200px; }
.building:nth-child(10) { height: 250px; }
.building:nth-child(11) { height: 160px; }
.building:nth-child(12) { height: 220px; }
.building:nth-child(13) { height: 190px; }
.building:nth-child(14) { height: 260px; }

.window {
    position: absolute;
    width: 10px;
    height: 16px;
    background: #e5d47a;
    box-shadow: 0 0 8px #e5d47a;
}

/* ROAD */
.road {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 230px;
    background:
        linear-gradient(to bottom,
        #26343a,
        #11181c);
    transform: perspective(500px) rotateX(8deg);
    transform-origin: bottom;
}

/* ROAD REFLECTION */
.reflection {
    position: absolute;
    bottom: 30px;
    left: 35%;
    width: 420px;
    height: 100px;
    background: rgba(190,230,235,.10);
    filter: blur(20px);
    border-radius: 50%;
}

/* ROAD LINES */
.road-line {
    position: absolute;
    bottom: 80px;
    width: 130px;
    height: 5px;
    background: #cdd4d5;
    opacity: .45;
    transform: skewX(-25deg);
}

.line1 { left: 5%; }
.line2 { left: 25%; }
.line3 { left: 75%; }
.line4 { left: 92%; }

/* SCOOTER AREA */
.scooter {
    position: absolute;
    left: 50%;
    bottom: 145px;
    transform: translateX(-50%);
    width: 620px;
    height: 360px;
}

/* WHEELS */
.wheel {
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #111;
    border: 8px solid #343b3f;
    box-shadow: inset 0 0 0 5px #090909;
}

.wheel::after {
    content: "";
    position: absolute;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 5px solid #aaa;
    top: 19px;
    left: 19px;
}

.front-wheel {
    right: 20px;
    bottom: 15px;
}

.back-wheel {
    left: 30px;
    bottom: 15px;
}

/* WHITE SCOOTER BODY */
.body-main {
    position: absolute;
    left: 100px;
    bottom: 60px;
    width: 400px;
    height: 155px;
    background: linear-gradient(145deg, #ffffff, #dce3e5);
    border-radius: 130px 100px 45px 45px;
    box-shadow:
        0 15px 20px rgba(0,0,0,.5),
        inset -8px -8px 15px rgba(120,130,135,.3);
}

/* FRONT */
.front {
    position: absolute;
    right: 30px;
    bottom: 130px;
    width: 105px;
    height: 170px;
    background: linear-gradient(135deg, #ffffff, #d7dee1);
    border-radius: 65px 65px 30px 30px;
    transform: rotate(8deg);
    box-shadow: 5px 10px 20px rgba(0,0,0,.35);
}

/* HANDLE */
.handle {
    position: absolute;
    right: 80px;
    top: 35px;
    width: 140px;
    height: 25px;
    border-radius: 20px;
    background: #171b1d;
    transform: rotate(-5deg);
}

.handle::before {
    content: "";
    position: absolute;
    width: 45px;
    height: 12px;
    background: #111;
    left: -30px;
    top: 5px;
    border-radius: 10px;
}

.handle::after {
    content: "";
    position: absolute;
    width: 45px;
    height: 12px;
    background: #111;
    right: -30px;
    top: 5px;
    border-radius: 10px;
}

/* SEAT */
.seat {
    position: absolute;
    left: 170px;
    bottom: 190px;
    width: 190px;
    height: 55px;
    background: #181b1d;
    border-radius: 50px 60px 20px 20px;
    transform: rotate(-2deg);
}

/* FOOT BOARD */
.board {
    position: absolute;
    left: 165px;
    bottom: 48px;
    width: 210px;
    height: 32px;
    background: #bfc7ca;
    border-radius: 30px;
    box-shadow: 0 5px 10px rgba(0,0,0,.4);
}

/* OLA LOGO */
.logo {
    position: absolute;
    left: 245px;
    bottom: 125px;
    font-size: 42px;
    font-weight: bold;
    color: #111;
    letter-spacing: -4px;
}

/* HEADLIGHT */
.headlight {
    position: absolute;
    right: 20px;
    bottom: 205px;
    width: 70px;
    height: 45px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow:
        0 0 15px #fff,
        0 0 35px #dffaff,
        0 0 70px rgba(220,250,255,.8);
}

/* HEADLIGHT BEAM */
.beam {
    position: absolute;
    right: -260px;
    bottom: 130px;
    width: 300px;
    height: 150px;
    background: linear-gradient(
        90deg,
        rgba(235,255,255,.25),
        transparent
    );
    clip-path: polygon(0 40%,100% 0,100% 100%);
    filter: blur(8px);
}

/* TAIL LIGHT */
.tail {
    position: absolute;
    left: 105px;
    bottom: 125px;
    width: 25px;
    height: 35px;
    border-radius: 50%;
    background: #ff3030;
    box-shadow: 0 0 20px red;
}

/* RAIN */
.rain {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.drop {
    position: absolute;
    width: 2px;
    height: 45px;
    background: linear-gradient(
        transparent,
        rgba(190,230,255,.8)
    );
    animation: rain linear infinite;
}

@keyframes rain {
    from {
        transform: translateY(-100px) rotate(12deg);
    }
    to {
        transform: translateY(110vh) rotate(12deg);
    }
}

/* TITLE */
.title {
    position: absolute;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    text-align: center;
    z-index: 5;
}

.title h1 {
    font-size: 38px;
    letter-spacing: 4px;
}

.title p {
    margin-top: 8px;
    color: #b9d5df;
    font-size: 15px;
}

/* WATER SPLASH */
.splash {
    position: absolute;
    bottom: 145px;
    left: 50%;
    width: 600px;
    height: 35px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 2px solid rgba(200,240,255,.25);
    filter: blur(2px);
}
</style>
</head>

<body>

<div class="scene">

    <div class="moon"></div>

    <div class="title">
        <h1>OLA ELECTRIC</h1>
        <p>Ride Through The Rain</p>
    </div>

    <!-- CITY -->
    <div class="city">
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
        <div class="building"></div>
    </div>

    <!-- ROAD -->
    <div class="road"></div>
    <div class="reflection"></div>

    <div class="road-line line1"></div>
    <div class="road-line line2"></div>
    <div class="road-line line3"></div>
    <div class="road-line line4"></div>

    <!-- SCOOTER -->
    <div class="scooter">

        <div class="wheel back-wheel"></div>
        <div class="wheel front-wheel"></div>

        <div class="body-main"></div>

        <div class="front"></div>

        <div class="seat"></div>

        <div class="board"></div>

        <div class="handle"></div>

        <div class="logo">OLA</div>

        <div class="headlight"></div>

        <div class="beam"></div>

        <div class="tail"></div>

    </div>

    <div class="splash"></div>

    <!-- RAIN -->
    <div class="rain" id="rain"></div>

</div>

<script>
const rain = document.getElementById("rain");

for (let i = 0; i < 180; i++) {

    const drop = document.createElement("div");

    drop.className = "drop";

    drop.style.left = Math.random() * 100 + "%";

    drop.style.animationDuration =
        (0.4 + Math.random() * 0.8) + "s";

    drop.style.animationDelay =
        Math.random() * 2 + "s";

    drop.style.opacity =
        0.2 + Math.random() * 0.7;

    rain.appendChild(drop);
}
</script>

</body>
</html>
